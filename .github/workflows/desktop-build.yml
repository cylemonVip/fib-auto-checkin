name: Build desktop applications
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
jobs:
  build:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Offline tests
        run: python -m unittest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python build_desktop.py
      - name: Prepare isolated test keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p fib-ci-tests "$RUNNER_TEMP/fib-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/fib-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/fib-ci.keychain-db"
          security unlock-keychain -p fib-ci-tests "$RUNNER_TEMP/fib-ci.keychain-db"
      - name: Verify packaged application startup
        run: python ci_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FIB-Checkin-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: FIB-Checkin-QA-${{ matrix.os }}
          path: artifacts/smoke-*/
          if-no-files-found: ignore
